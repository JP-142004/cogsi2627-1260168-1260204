---
- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nginx_install
  retries: 3
  delay: 5
  until: nginx_install is succeeded

- name: Configurar proxy para Bookstore
  ansible.builtin.copy:
    src: bookstore.conf
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Recarregar Nginx

- name: Garantir site ativo
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: Recarregar Nginx

- name: Validar configuracao Nginx
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false

- name: Garantir Nginx iniciado e ativo no arranque
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Aplicar configuracao pendente do proxy
  ansible.builtin.meta: flush_handlers

- name: Verificar acesso a Bookstore atraves do proxy
  ansible.builtin.uri:
    url: http://127.0.0.1/books
    status_code: 200
    return_content: true
  register: proxy_health
  retries: 10
  delay: 3
  until: proxy_health.status | default(0) == 200
