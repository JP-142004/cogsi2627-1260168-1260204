---
- name: Implantar a imagem produzida pelo pipeline na VM de produção
  hosts: production
  become: true
  gather_facts: false
  vars:
    dockerhub_username: "{{ lookup('ansible.builtin.env', 'DOCKERHUB_USERNAME') }}"
    dockerhub_token: "{{ lookup('ansible.builtin.env', 'DOCKERHUB_TOKEN') }}"
    docker_registry_url: "{{ lookup('ansible.builtin.env', 'DOCKER_REGISTRY_URL') | default('https://index.docker.io/v1/', true) }}"
  pre_tasks:
    - name: Validar a imagem pedida
      ansible.builtin.import_tasks: tasks/validate-image.yml

    - name: Confirmar que as credenciais foram fornecidas pelo ambiente
      ansible.builtin.assert:
        that:
          - dockerhub_username | length > 0
          - dockerhub_token | length > 0
      no_log: true

  tasks:
    - name: Garantir que Docker está instalado e ativo
      ansible.builtin.import_tasks: tasks/install-docker.yml

    - name: Criar uma pasta temporária para a autenticação Docker
      ansible.builtin.tempfile:
        state: directory
        prefix: ca5-docker-auth-
      register: docker_auth_directory

    - name: Obter a imagem usando credenciais temporárias
      block:
        - name: Autenticar no Docker Hub
          community.docker.docker_login:
            registry_url: "{{ docker_registry_url }}"
            username: "{{ dockerhub_username }}"
            password: "{{ dockerhub_token }}"
            config_path: "{{ docker_auth_directory.path }}/config.json"
            reauthorize: true
          no_log: true

        - name: Obter a imagem antes de interromper o container existente
          community.docker.docker_image:
            name: "{{ image_reference }}"
            source: pull
            force_source: true
          environment:
            DOCKER_CONFIG: "{{ docker_auth_directory.path }}"

      always:
        - name: Remover as credenciais temporárias da VM
          ansible.builtin.file:
            path: "{{ docker_auth_directory.path }}"
            state: absent

    - name: Parar e remover o container anterior, se existir
      community.docker.docker_container:
        name: "{{ bookstore_container_name }}"
        state: absent

    - name: Arrancar o novo container com a imagem obtida
      community.docker.docker_container:
        name: "{{ bookstore_container_name }}"
        image: "{{ image_reference }}"
        state: started
        pull: never
        restart_policy: unless-stopped
        published_ports:
          - "{{ bookstore_port }}:8080"
        memory: "{{ bookstore_memory_limit }}"
        env:
          SERVICE_ENVIRONMENT: production
          JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"

    - name: Validar o container e a API depois do deploy
      ansible.builtin.import_tasks: tasks/verify.yml
