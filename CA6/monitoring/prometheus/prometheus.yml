global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.56.10:9100"]
        labels:
          instance_name: app
      - targets: ["192.168.56.20:9100"]
        labels:
          instance_name: proxy
      - targets: ["192.168.56.30:9100"]
        labels:
          instance_name: db
      - targets: ["192.168.56.40:9100"]
        labels:
          instance_name: monitoring
