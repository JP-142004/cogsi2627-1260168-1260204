# Spring Boot application properties
spring.application.name=bookstore-api
server.port=8080

# H2 database configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:bookstore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom service metadata properties
service.version=@appVersion@
service.environment=@environment@
service.buildTimestamp=@buildTimestamp@

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=bookstore
# Histograma para calcular percentis de latência em PromQL
management.metrics.distribution.percentiles-histogram.http.server.requests=true
