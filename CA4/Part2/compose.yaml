name: bookstore-ca4

services:
  db:
    build: ./db
    image: bookstore-db:ca4
    environment:
      H2_PORT: "9092"
      H2_BASE_DIR: /data
    volumes:
      - h2-data:/data
    networks:
      backend:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/h2.jar org.h2.tools.Shell -url 'jdbc:h2:tcp://localhost:9092/./bookstore' -user sa -password '' -sql 'SELECT 1' | grep -q 1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    image: bookstore-web:ca4
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:tcp://db:9092/./bookstore
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SERVER_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  proxy:
    build: ./proxy
    image: bookstore-proxy:ca4
    ports:
      - "${PROXY_PORT:-8084}:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  h2-data:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  frontend: